name: Check video frame capture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: python -m pip install playwright
      - name: Capture actual player frame
        run: |
          mkdir -p /tmp/player-check
          python - <<'PY'
          import shutil,json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=shutil.which('google-chrome'),headless=True,args=['--autoplay-policy=no-user-gesture-required'])
              page=browser.new_page(viewport={'width':1600,'height':1100})
              page.goto('https://www.youtube.com/watch?v=YBTBDgdm_YM',wait_until='domcontentloaded',timeout=45000)
              page.wait_for_timeout(10000)
              result=page.evaluate('''async () => {
                const v=document.querySelector('video');
                if (!v) return {video:false};
                v.muted=true;
                try { v.play().catch(() => {}); } catch (_) {}
                return {video:true,ready:v.readyState,time:v.currentTime};
              }''')
              page.wait_for_timeout(12000)
              status=page.evaluate('''() => {const v=document.querySelector('video');return {time:v?.currentTime,ready:v?.readyState,error:document.querySelector('.ytp-error-content-wrap')?.innerText||''}}''')
              print('PLAYER_STATUS',json.dumps(status,ensure_ascii=False))
              page.screenshot(path='/tmp/player-check/page.png')
              video=page.locator('video').first
              if video.count() and video.is_visible(): video.screenshot(path='/tmp/player-check/video.png')
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-player-check
          path: /tmp/player-check
          retention-days: 1
