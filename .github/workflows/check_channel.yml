name: Verify YouTube channel identity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Compare public channel IDs
        run: |
          python - <<'PY'
          import ast,json,re,urllib.request
          from pathlib import Path
          tree=ast.parse(Path('dongaupdate.py').read_text())
          boards=next(ast.literal_eval(n.value) for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='YOUTUBE_BOARDS' for t in n.targets))
          urls=[boards[0]['url'],'https://www.youtube.com/channel/UCRrRALymR3fxeU5f7GkLuVA/streams']
          for label,url in zip(['CONFIGURED','USER_CHANNEL'],urls):
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              html=urllib.request.urlopen(request,timeout=25).read().decode()
              match=re.search(r'"channelMetadataRenderer"\s*:\s*',html)
              if not match:
                  print(label,'METADATA_UNAVAILABLE')
                  continue
              data=json.JSONDecoder().raw_decode(html[match.end():])[0]
              print(label,json.dumps({k:data.get(k) for k in ['title','externalId','vanityChannelUrl']},ensure_ascii=False))
          PY
