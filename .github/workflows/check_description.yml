name: Inspect public video description
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read public description
        run: |
          python - <<'PY'
          import urllib.request,re,json
          u='https://www.youtube.com/watch?v=YBTBDgdm_YM'
          r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=25)
          html=r.read().decode()
          match=re.search(r'(?:var\s+)?ytInitialPlayerResponse\s*=\s*',html)
          if match:
              data=json.JSONDecoder().raw_decode(html[match.end():])[0]
              print('VIDEO_TITLE',data.get('videoDetails',{}).get('title'))
              print('DESCRIPTION_JSON',json.dumps(data.get('videoDetails',{}).get('shortDescription'),ensure_ascii=False))
              print('PLAYABILITY',data.get('playabilityStatus',{}).get('status'))
          else:
              print('NO_PLAYER_DATA')
          PY
