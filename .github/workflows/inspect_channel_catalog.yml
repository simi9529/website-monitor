name: Inspect public channel listings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - run: python -m pip install requests
      - name: Inspect channel listings without sending alerts
        run: |
          python - <<'PY'
          import requests
          from youtube_channel_live import browse,CHANNEL,playlists,monitor_channel_live
          from youtube_live import live_streams
          def get(url,name):
              r=requests.get(url,timeout=20,headers={'User-Agent':'Mozilla/5.0'})
              print('GET',r.status_code,url)
              return r
          monitor_channel_live({'name':'공모주투자'},{},get,lambda *a,**k:print('MATCHING_ACTIVE_BROADCAST'))
          for suffix in ['/streams','/playlists']:
              try:
                  for page in browse(CHANNEL+suffix,'channel',get,requests.post):
                      print('PAGE',suffix,'PLAYLISTS',sorted(playlists(page)),'VIDEOS',len(live_streams(page,allow_empty=True)))
              except Exception as e:print('DIAGNOSTIC',type(e).__name__,str(e)[:150])
          PY
