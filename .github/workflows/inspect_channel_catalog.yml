name: Inspect public channel listings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - run: python -m pip install requests
      - name: Inspect channel listings without sending alerts
        run: |
          python - <<'PY'
          import requests
          import re,json
          from youtube_channel_live import browse,CHANNEL,playlists,monitor_channel_live,initial,selected
          from youtube_live import live_streams,walk
          def get(url,name):
              r=requests.get(url,timeout=20,headers={'User-Agent':'Mozilla/5.0'})
              print('GET',r.status_code,url)
              return r
          monitor_channel_live({'name':'공모주투자'},{},get,lambda *a,**k:print('MATCHING_ACTIVE_BROADCAST'))
          for suffix in ['/streams','/playlists']:
              raw=get(CHANNEL+suffix,'channel')
              data=initial(raw.text)
              print('TABS',suffix,[(x.get('tabRenderer',{}).get('title'),x.get('tabRenderer',{}).get('selected')) for x in data.get('contents',{}).get('twoColumnBrowseResultsRenderer',{}).get('tabs',[])])
              print('TOKENS',suffix,sum(1 for n in walk(selected(data)) if 'continuationCommand' in n),'CONFIG_MATCHES',len(list(re.finditer(r'ytcfg\.set\(\s*',raw.text))))
              for m in re.finditer(r'ytcfg\.set\(\s*',raw.text):
                  c=json.JSONDecoder().raw_decode(raw.text[m.end():])[0]
                  print('CONFIG_CONTEXT',bool(c.get('INNERTUBE_CONTEXT')))
              print('CONTENT_TYPES',suffix,sorted({n.get('contentType') for n in walk(selected(data)) if n.get('contentType')}))
              try:
                  for page in browse(CHANNEL+suffix,'channel',get,requests.post):
                      print('PAGE',suffix,'PLAYLISTS',sorted(playlists(page)),'VIDEOS',len(live_streams(page,allow_empty=True)))
              except Exception as e:print('DIAGNOSTIC',type(e).__name__,str(e)[:150])
          PY
