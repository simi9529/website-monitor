name: Check YouTube live detection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Inspect public stream metadata
        run: |
          python - <<'PY'
          import urllib.request,re,json
          from youtube_live import live_streams,walk
          url='https://www.youtube.com/@%EA%B3%B5%EB%AA%A8%EC%A3%BC%ED%88%AC%EC%9E%90%EC%9D%98%EB%B2%95%EC%B9%99/streams'
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ko-KR,ko;q=0.9'})
          html=urllib.request.urlopen(request,timeout=30).read().decode()
          data=json.loads(re.search(r'var ytInitialData\s*=\s*(\{.*?\});</script>',html)[1])
          print('VIDEOS',json.dumps(live_streams(data)[:5],ensure_ascii=False))
          for n in walk(data.get('contents',{})):
              for k,v in n.items():
                  if k in ('thumbnailBadgeViewModel','metadataBadgeRenderer','thumbnailOverlayTimeStatusRenderer'):
                      print('BADGE',k,json.dumps(v,ensure_ascii=False))
          PY
