name: Site Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # 5분마다 실행
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      send_latest_ewhaian:
        description: '이화이언 최신 글 링크를 담은 시험 메일 1통 발송'
        required: false
        default: false
        type: boolean
      test_canvas:
        description: 'Canvas 통합 로그인 후 최신 공지·대화 링크를 시험 메일로 발송'
        required: false
        default: false
        type: boolean

concurrency:
  group: site-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # titles.json의 마지막 알림 상태 저장
    env:
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      EWHA_ID: ${{ secrets.EWHA_ID }}
      EWHA_PW: ${{ secrets.EWHA_PW }}
      CANVAS_ID: ${{ secrets.CANVAS_ID }}
      CANVAS_PW: ${{ secrets.CANVAS_PW }}
      CANVAS_REPLACE_SESSION: 'true' # 사용자가 학교 포털 기존 연결 종료를 허용함
      SEND_LATEST_EWHAIAN: ${{ github.event.inputs.send_latest_ewhaian || 'false' }}
      TEST_CANVAS: ${{ github.event.inputs.test_canvas || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Validate Actions secrets
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          required = ["FROM_EMAIL", "TO_EMAIL", "APP_PASSWORD"]
          if os.environ.get("SEND_LATEST_EWHAIAN") == "true" and os.environ.get("TEST_CANVAS") == "true":
              print("::error::시험 발송 옵션은 한 번에 하나만 선택하세요.")
              raise SystemExit(2)
          if os.environ.get("SEND_LATEST_EWHAIAN") == "true":
              required += ["EWHA_ID", "EWHA_PW"]
          if os.environ.get("TEST_CANVAS") == "true":
              required += ["CANVAS_ID", "CANVAS_PW"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              for name in missing:
                  print(f"::error title=Actions Secret 누락::{name} 값이 이 작업에 전달되지 않았습니다.")
              instructions = (
                  "GitHub 저장소 Settings → Secrets and variables → Actions → Secrets에서 "
                  "위 이름으로 값을 등록하세요. 클라우드 환경 설정의 변수는 자동 전달되지 않습니다. "
                  "Secrets 변경 후 Re-run jobs로 다시 실행할 수 있습니다."
              )
              print(instructions)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with Path(summary).open("a", encoding="utf-8") as report:
                      report.write("## 필수 설정 누락: 메일을 발송하지 않았습니다\n\n")
                      report.write("\n".join(f"- `{name}`" for name in missing))
                      report.write("\n\n" + instructions + "\n")
              raise SystemExit(2)
          print("필수 Actions Secrets가 전달되었습니다. 값은 출력하지 않습니다.")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Canvas login browser
        if: env.CANVAS_ID != '' && env.CANVAS_PW != '' && env.SEND_LATEST_EWHAIAN != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run script
        run: |
          if [ "$TEST_CANVAS" = "true" ]; then
            python dongaupdate.py --test-canvas
          elif [ "$SEND_LATEST_EWHAIAN" = "true" ]; then
            python dongaupdate.py --send-latest-ewhaian
          else
            python dongaupdate.py
          fi

      - name: Commit updated titles.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add titles.json
          git commit -m "🔄 상태 업데이트" || echo "No changes"
          git push
